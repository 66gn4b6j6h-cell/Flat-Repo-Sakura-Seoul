let historyStack=[];
function current(){return decodeURI(location.hash.slice(1)||'home')}
function go(r,push=true){
  if(!r)return;
  if(push&&current()!==r)historyStack.push(current());
  if(location.hash.slice(1)!==r) location.hash=r;
  else render();
}
function back(){if(historyStack.length)go(historyStack.pop(),false);else if(current()!=='home')go('home',false);else history.back()}

function shoppingFull(c){let q=qp(),city=q.city||'',area=q.area||'',all=DATA.shopping.filter(x=>c==='South Korea'?x.city==='Seoul':x.city!=='Seoul');if(city)all=all.filter(x=>x.city===city || (city==='Fuji / Fujiyoshida'&&String(x.city).includes('Fuji')));if(area)all=all.filter(x=>(x.area||'Other')===area);if(!city){let cs=c==='South Korea'?['Seoul']:[...new Set(all.map(x=>x.city))];return `<h1>${c==='South Korea'?'Seoul':'Japan'} Shopping</h1><p class="sub">City → area → store → individual saved items.</p><div class="grid">${cs.map(z=>plainTile(z,`${all.filter(x=>x.city===z).length} saved stores`,`shopping?country=${encodeURIComponent(c)}&city=${encodeURIComponent(z)}`)).join('')}</div>`}if(!area){let as=[...new Set(all.map(x=>x.area||'Other'))];return `<h1>${esc(city)} Shopping</h1><div class="grid">${as.map(z=>plainTile(z,`${all.filter(x=>(x.area||'Other')===z).length} saved stores`,`shopping?country=${encodeURIComponent(c)}&city=${encodeURIComponent(city)}&area=${encodeURIComponent(z)}`)).join('')}</div>`}return `<h1>${esc(area)}</h1><div class="savedLabel">Our Saved Stores</div>${all.map(x=>`<div class="card click" data-route="shop/${encodeURIComponent(x.id)}"><h3>${esc(x.name)}</h3><p>${esc(x.why||'Saved from your trip planning notes.')}</p><p><b>Saved items:</b> ${esc(x.buy||'Open for details')}</p></div>`).join('')}<h2 class="sectionTitle">Recommended Nearby</h2><div class="card"><p>Recommendations remain separate from your saved list. Recheck current hours/branches before the trip.</p></div>`}
const PHRASES={Japan:[['Food','I am vegetarian.','私はベジタリアンです。','Watashi wa bejitarian desu'],['Food','No egg, please.','卵なしでお願いします。','Tamago nashi de onegaishimasu'],['Food','Does this contain meat or fish?','肉や魚が入っていますか？','Niku ya sakana ga haitte imasu ka?'],['Hotel','I have a reservation.','予約があります。','Yoyaku ga arimasu'],['Hotel','Can you send my luggage to this hotel?','このホテルに荷物を送れますか？','Kono hoteru ni nimotsu o okuremasu ka?'],['Transport','Which platform is it?','何番ホームですか？','Nanban hoomu desu ka?'],['Transport','Where is the bus stop?','バス停はどこですか？','Basutei wa doko desu ka?'],['Bathroom','Where is the restroom?','トイレはどこですか？','Toire wa doko desu ka?'],['Shopping','Is this tax-free?','これは免税ですか？','Kore wa menzei desu ka?']], 'South Korea':[['Food','I am vegetarian.','저는 채식주의자예요.','Jeoneun chaesikjuuijayeyo'],['Food','No egg, please.','계란 빼 주세요.','Gyeran ppae juseyo'],['Hotel','I have a reservation.','예약했어요.','Yeyakhaesseoyo'],['Hotel','Can you keep our luggage?','짐을 맡아 주실 수 있나요?','Jimeul mata jusil su innayo?'],['Transport','Where is the subway station?','지하철역이 어디예요?','Jihacheol-yeogi eodiyeyo?'],['Bathroom','Where is the restroom?','화장실이 어디예요?','Hwajangsil-i eodiyeyo?'],['Shopping','Is this tax-free?','택스 리펀드 돼요?','Taekseu ripeondeu dwaeyo?']]};
function speakPhrase(t,lang){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang;speechSynthesis.speak(u)}}
function languageFull(c){let a=PHRASES[c]||PHRASES.Japan;return `<h1>${c==='South Korea'?'Korean':'Japanese'} Language Cheat Sheet</h1><p class="sub">Food, hotel, luggage, transport, bathroom and shopping phrases.</p>${a.map(x=>`<div class="card phrase"><div><span class="badge">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}<small>${x[3]}</small></p></div><button class="btn" onclick="speakPhrase('${x[2].replaceAll("'","\\'")}','${c==='South Korea'?'ko-KR':'ja-JP'}')">▶</button></div>`).join('')}`}
function convenienceFull(c){if(c==='South Korea')return `<h1>Convenience Stores</h1><div class="card"><h3>CU · GS25 · 7-Eleven · emart24</h3><p>Useful for water, drinks, snacks, ATMs and basic travel supplies. Check labels for egg, fish sauce, meat extracts and gelatin.</p></div>`;let rows=[['Drinks','Water / tea / coffee','Easy reliable buys. Check milk in bottled coffee if needed.'],['Onigiri','Rice balls','Many fillings contain fish, meat, mayo or egg — read the ingredient label carefully.'],['Bread & desserts','Bakery / sweets','Egg and dairy are common; Riya should verify every item.'],['Instant noodles','Cup noodles','Broth frequently contains fish/meat extracts even when the visible toppings look vegetarian.'],['Practical','ATMs / umbrellas / toiletries','7-Eleven ATMs, umbrellas, hand towels, trash bags and travel-size toiletries are useful trip basics.']];return `<h1>Japan Convenience Stores</h1><p class="sub">7-Eleven · FamilyMart · Lawson</p>${rows.map(x=>`<div class="card"><span class="badge">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}`}
function packing(section='weather'){let nav=['weather','checklist','city','luggage','essentials'];let tabs=`<div class="chips">${nav.map(x=>`<button class="btn" data-route="packing/${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div>`;let body='';if(section==='weather')body=`<div class="card"><h3>October planning</h3><p>Pack light layers for Japan and a slightly warmer evening layer for Seoul. Actual forecasts should be checked close to travel dates.</p></div>`;if(section==='checklist')body=`<div class="card">${['Passports / travel confirmations','Comfortable walking shoes','Light layers','Compact umbrella','Chargers / power bank','Medication and essentials','Foldable duffel for shopping'].map(x=>`<label class="checkRow"><input type="checkbox"> ${x}</label>`).join('')}</div>`;if(section==='city')body=[['Osaka','Light layers; long walking days'],['Kyoto','Comfortable shoes; early mornings'],['Fuji / Fujiyoshida','Warmer layer for cool mornings/evenings'],['Tokyo','Flexible layers and shopping space'],['Seoul','Warmer evening layer']].map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('');if(section==='luggage')body=luggage();if(section==='essentials')body=`<div class="grid">${plainTile('Bookings & Travel Info','Hotels, flights and confirmed tickets','bookings')}${plainTile('Language Cheat Sheet','Japanese + Korean','language?country=Japan')}${plainTile('Luggage Services','Forwarding strategy','luggage')}${plainTile('Connectivity','eSIM, charging, offline access','connectivity')}</div>`;return `<h1>Packing & Weather</h1><div class="packingHero"><img src="${EXTRA_ASSETS.packing}" alt="Packing & Weather"></div>${tabs}<div style="margin-top:14px">${body}</div>`}
function luggage(){return `<h1>Luggage & Forwarding</h1><div class="card"><h3>Kyoto → Fuji / Fujiyoshida</h3><p>For the Oct 12 transfer, keep your Fuji overnight essentials with you. The booked Kaneyamaen bus leaves Mishima at 13:10, Gotemba at 14:10, includes a seasonal attraction and arrives 15:30.</p></div><div class="card"><h3>Forwarding strategy</h3><p>Where practical, forward the larger suitcase ahead to reduce carrying on transfer days. Keep valuables, electronics, medication, travel confirmations and one change of clothes with you.</p></div><div class="card"><h3>At the hotel</h3><p>Ask the front desk whether they can arrange takkyubin / luggage delivery and confirm the receiving hotel name, address and delivery date before sending.</p></div>`}
function bookings(){return `<h1>Bookings & Travel Info</h1><div class="grid">${plainTile('Accommodation','Booked stays and bases','journey')}${plainTile('Flights & Tickets','Confirmed anchors','readiness')}${plainTile('Luggage Services','Forwarding and transfer notes','luggage')}${plainTile('Language','Travel phrases','language?country=Japan')}${plainTile('Connectivity','eSIM, charging, offline access','connectivity')}</div>`}
function connectivity(){return `<h1>Connectivity</h1><div class="card"><h3>Before departure</h3><p>Install/activate your chosen eSIM, save hotel addresses and confirmations offline, download map areas, and carry a power bank plus charging cables.</p></div>`}
function guideFull(sec,c){if(sec==='convenience')return convenienceFull(c);if(sec==='getting')return `<h1>Getting Around</h1><div class="card"><h3>${c==='Japan'?'Japan transit':'Seoul transit'}</h3><p>${c==='Japan'?'Use an IC card for local transit. Keep reserved intercity tickets and the booked Kaneyamaen transfer separate.':'Use T-money for subway/bus. AREX or limousine bus are practical airport-transfer options.'}</p></div>${c==='Japan'?routeTrack():''}`;if(sec==='quick')return `<h1>Quick Reference</h1><div class="grid">${plainTile('Language','Cheat sheet','language?country='+encodeURIComponent(c))}${plainTile('Convenience Stores','Saved practical notes','convenience?country='+encodeURIComponent(c))}${plainTile('Luggage','Forwarding','luggage')}${plainTile('Safety','Emergency information','safety?country='+encodeURIComponent(c))}</div>`;return guide(sec,c)}
function render(){let r=current(), path=r.split('?')[0], q=qp(), parts=path.split('/'), v='';$('#back').style.visibility=r==='home'?'hidden':'visible';if(path==='home')v=home();else if(path==='journey')v=journey();else if(path==='japan')v=countryHub('Japan');else if(path==='seoul')v=countryHub('South Korea');else if(path==='today')v=today(q.country||'Japan');else if(parts[0]==='day')v=day(parts[1],q.country||'Japan');else if(path==='itinerary')v=itinerary(q.country||'Japan');else if(path==='cities')v=citiesFull(q.country||'Japan');else if(parts[0]==='city')v=cityFull(decodeURIComponent(parts.slice(1).join('/')));else if(path==='food')v=foodFull(q.country||'Japan');else if(parts[0]==='restaurant')v=restaurant(decodeURIComponent(parts[1]||''));else if(path==='shopping')v=shoppingFull(q.country||'Japan');else if(parts[0]==='shop')v=shop(decodeURIComponent(parts[1]||''));else if(path==='weather')v=weather(q.country||'Japan');else if(path==='safety')v=safety(q.country||'Japan');else if(path==='emergency')v=emergency(q.country||'Japan');else if(path==='evacuation')v=evacuation(q.country||'Japan');else if(path==='embassy')v=embassy(q.country||'Japan');else if(path==='info')v=info(q.country||'Japan');else if(path==='convenience')v=convenienceFull(q.country||'Japan');else if(path==='language')v=languageFull(q.country||'Japan');else if(path==='localguide')v=localguide(q.country||'Japan');else if(parts[0]==='guide')v=guideFull(parts[1],q.country||'Japan');else if(path==='packing'||parts[0]==='packing')v=packing(parts[1]||'weather');else if(path==='luggage')v=luggage();else if(path==='bookings')v=bookings();else if(path==='connectivity')v=connectivity();else if(path==='wallet')v=wallet(q.country||'');else if(path==='readiness')v=readiness();else v=home();$('#view').innerHTML=v;restoreChecks();scrollTo(0,0)}

// Single internal navigation handler. No inline-route interception and no duplicate listeners.
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-route]');
  if(!el)return;
  e.preventDefault();
  go(el.dataset.route);
});
addEventListener('hashchange',render);render();
</script></body></html>
