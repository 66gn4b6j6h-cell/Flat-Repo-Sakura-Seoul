let historyStack=[];
function current(){return decodeURI(location.hash.slice(1)||'home')}
function go(r,push=true){

}

function dayCard(d,showEdit=false,c='Japan'){if(!d)return '<div class="empty">No day found.</div>';let cityKey=d.city.includes('Osaka')?'Osaka':d.city.includes('Kyoto')?'Kyoto':d.city.includes('Fuji')?'Fuji':d.city.includes('Seoul')?'Seoul':d.city.includes('Kamakura')?'Tokyo':d.city.includes('Tokyo')?'Tokyo':'';return `<div class="dayTop"><div><h1>${esc(d.label)}</h1><span class="dayCity">${esc(d.city)}</span></div>${showEdit?`<button class="btn primary" onclick="toggleDayEditor('${d.date}')">Edit</button>`:''}</div><div class="activityList">${activityBlock('Morning',d.morning,d,c)}${activityBlock('Afternoon',d.afternoon,d,c)}${activityBlock('Evening',d.evening,d,c)}</div><div class="card noRepeat"><span class="period">GETTING AROUND</span><h3>${esc(d.transport)}</h3><div class="activityActions"><button class="btn primary" data-route="guide/getting?country=${encodeURIComponent(c)}&city=${encodeURIComponent(cityKey)}">Routes & live status</button></div></div><div class="dayTools"><button class="dayTool" data-route="food?country=${encodeURIComponent(c)}&city=${encodeURIComponent(cityKey)}"><b>Vegetarian food</b><small>Saved + nearby</small></button><button class="dayTool" data-route="shopping?country=${encodeURIComponent(c)}&city=${encodeURIComponent(cityKey)}"><b>Shopping</b><small>Saved + nearby</small></button><button class="dayTool" data-route="guide/attractions?country=${encodeURIComponent(c)}"><b>Optional stops</b><small>Hidden gems</small></button><button class="dayTool" data-route="language?country=${encodeURIComponent(c)}"><b>Language</b><small>Translate & speak</small></button></div><div id="dayEditor_${d.date}" class="walletForm hidden"></div>`}

async function refreshFx(){let box=document.getElementById('fxLive');if(!box)return;box.innerHTML='Updating…';try{let r=await fetch('https://open.er-api.com/v6/latest/CAD',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();if(j.result!=='success'||!j.rates?.JPY||!j.rates?.KRW)throw new Error('Bad FX response');let payload={rates:{JPY:j.rates.JPY,KRW:j.rates.KRW,USD:j.rates.USD},date:j.time_last_update_utc,at:new Date().toISOString()};localStorage.setItem('ssj_fx_cache',JSON.stringify(payload));box.innerHTML=`1 CAD = <b>${j.rates.JPY.toFixed(2)} JPY</b> · <b>${j.rates.KRW.toFixed(2)} KRW</b> · ${j.rates.USD.toFixed(4)} USD<br><span class="liveStatus">Updated: ${esc(j.time_last_update_utc)}</span><div class="fxAttribution">Rates by ExchangeRate-API · indicative only</div>`;}catch(e){let x=localStorage.getItem('ssj_fx_cache');if(x){let j=JSON.parse(x);box.innerHTML=`Cached: 1 CAD = <b>${Number(j.rates.JPY).toFixed(2)} JPY</b> · <b>${Number(j.rates.KRW).toFixed(2)} KRW</b><br><span class="liveStatus">Last successful refresh: ${esc(j.date||j.at)}</span>`}else box.textContent='Unable to refresh. Try again when connected.'}}

function saveExpenseForm(e,id){

function guideFull(sec,c){if(sec==='convenience')return convenienceFull(c);if(sec==='getting')return gettingAround(c);if(sec==='quick')return `<h1>Quick Reference</h1><div class="grid">${plainTile('Language','Cheat sheet + add phrases','language?country='+encodeURIComponent(c))}${plainTile('Convenience Stores','Saved practical notes','convenience?country='+encodeURIComponent(c))}${plainTile(c==='Japan'?'Luggage Forwarding':'Airport Limousine',c==='Japan'?'Japan forwarding':'ICN ↔ Seoul','luggage?country='+encodeURIComponent(c))}${plainTile('Safety','Emergency information','safety?country='+encodeURIComponent(c))}</div>`;if(sec==='glance')return atAGlance(c);if(sec==='attractions')return attractionsFull(c);return guide(sec,c)}
function atAGlance(c){if(c==='South Korea')return `<h1>Seoul · At a Glance</h1><div class="quickGrid"><div class="card compactCard"><b>Stay</b><h3>Oct 21–25</h3><p>4 nights in Seoul.</p></div><div class="card compactCard"><b>Arrival</b><h3>Oct 21 · NRT → ICN</h3><p>Airport transfer options are in Getting Around.</p></div></div><div class="grid">${plainTile('Today','Day-by-day plan','today?country=South%20Korea')}${plainTile('Airport Transfer','Limousine + AREX','luggage?country=South%20Korea')}${plainTile('Food','Saved + recommended','food?country=South%20Korea')}${plainTile('Shopping','Saved + recommended','shopping?country=South%20Korea')}</div>`;
return `<h1>Japan · At a Glance</h1><p class="sub">Trip dashboard and confirmed anchors.</p><div class="quickGrid">
<div class="card compactCard"><b>Main route</b><h3>Osaka → Kyoto → Fuji → Tokyo</h3><p>Oct 7–21. Uji + Nara are the Oct 9 day trip; Kamakura is Oct 19.</p></div>
<div class="card compactCard"><b>Oct 12</b><h3>Kyoto → Mishima → Kaneyamaen</h3><p>Confirmed bus leaves Mishima 13:10 and arrives 15:30.</p></div>
<div class="card compactCard"><b>Oct 17</b><h3>Harry Potter · 10:00</h3><p>Confirmed.</p></div>
<div class="card compactCard"><b>Oct 18</b><h3>Tokyo DisneySea</h3><p>Confirmed.</p></div>
<div class="card compactCard"><b>Oct 20</b><h3>teamLab Planets · 08:30–09:00</h3><p>Confirmed.</p></div>
<div class="card compactCard"><b>Transport</b><h3>Sagano booked</h3><p>Use Getting Around for live official routes and service updates.</p></div>
</div><div class="grid">${plainTile('Today','Editable itinerary','today?country=Japan')}${plainTile('Getting Around','Routes + official links','guide/getting?country=Japan')}${plainTile('Luggage Forwarding','Kyoto → Tokyo strategy','luggage?country=Japan')}${plainTile('Food','Saved + recommended','food?country=Japan')}${plainTile('Shopping','Saved + recommended','shopping?country=Japan')}${plainTile('Language','Interactive cheat sheet','language?country=Japan')}</div>`}

function food(c){return foodBase(c)+recommendationSection(c,'food')}
function shopping(c){return shoppingBase(c)+recommendationSection(c,'shopping')}
const AREA_RECS={
Japan:{
food:[['Arashiyama','Use saved Arashiyama cafés first','Keep recommendations near the Oct 11 route; verify vegetarian/egg status before treating any new place as suitable.'],['Ginza','Tokyo itinerary fit','Surface nearby vegetarian options around your Ginza hotel and booked Tokyo anchors.']],
shopping:[['Ginza','Tokyo hotel area','Cluster department stores, stationery, beauty and saved Ginza items.'],['Shibuya / Shinjuku','Tokyo shopping clusters','Surface nearby options only after the saved-store list.']]
},
'South Korea':{
food:[['Myeongdong / Euljiro','Hotel-area fit','Show vegetarian-suitable recommendations separately from saved Seoul food.'],['Seongsu','Itinerary-area fit','Recommendations should match the day/area rather than all of Seoul.']],
shopping:[['Myeongdong / Euljiro','Beauty + department stores','Recommendations stay separate from your saved stores.'],['Seongsu','Fashion + perfume','Use this for nearby discoveries around the Seongsu day.']]
}};
function recommendationSection(c,type){let a=(AREA_RECS[c]||AREA_RECS.Japan)[type]||[];return `<section class="section"><div class="sectionLead"><div><span class="savedMark">RECOMMENDED NEARBY</span><h2>Additional ideas</h2></div></div><p class="sub">These are not part of Our Saved ${type==='food'?'Places':'Stores'} unless you choose Save.</p>${a.map(x=>`<div class="card compactCard recCard"><span class="badge">${x[0]}</span><h3>${x[1]}</h3><p>${x[2]}</p><button class="btn" onclick="saveRecommendation('${type}','${x[0].replaceAll("'","\\'")} — ${x[1].replaceAll("'","\\'")}')">Save to my list</button></div>`).join('')}</section>`}

function render(){let r=current(), path=r.split('?')[0], q=qp(), parts=path.split('/'), v='';$('#back').style.visibility=r==='home'?'hidden':'visible';if(path==='home')v=home();else if(path==='journey')v=journey();else if(path==='japan')v=countryHub('Japan');else if(path==='seoul')v=countryHub('South Korea');else if(path==='today')v=today(q.country||'Japan');else if(parts[0]==='day')v=day(parts[1],q.country||'Japan');else if(path==='itinerary')v=itinerary(q.country||'Japan');else if(path==='cities')v=citiesFull(q.country||'Japan');else if(parts[0]==='city')v=cityFull(decodeURIComponent(parts.slice(1).join('/')));else if(parts[0]==='hotel')v=hotelDetail(decodeURIComponent(parts.slice(1).join('/')));else if(path==='food')v=foodFull(q.country||'');else if(parts[0]==='restaurant')v=restaurant(decodeURIComponent(parts[1]||''));else if(path==='shopping')v=shoppingFull(q.country||'Japan');else if(parts[0]==='shop')v=shop(decodeURIComponent(parts[1]||''));else if(path==='weather')v=weather(q.country||'Japan');else if(path==='safety')v=safety(q.country||'Japan');else if(path==='emergency')v=emergency(q.country||'Japan');else if(path==='evacuation')v=evacuation(q.country||'Japan');else if(path==='embassy')v=embassy(q.country||'Japan');else if(path==='info')v=info(q.country||'Japan');else if(path==='convenience')v=convenienceFull(q.country||'Japan');else if(path==='language')v=languageFull(q.country||'Japan');else if(path==='localguide')v=localguide(q.country||'Japan');else if(parts[0]==='guide')v=guideFull(parts[1],q.country||'Japan');else if(path==='packing'||parts[0]==='packing')v=packing(parts[1]||'weather');else if(path==='luggage')v=luggage(q.country||'Japan');else if(path==='bookings')v=bookings();else if(path==='connectivity')v=connectivity();else if(path==='wallet')v=wallet(q.country||'');else if(path==='readiness')v=readiness();else v=home();$('#view').innerHTML=v;restoreChecks();scrollTo(0,0)}

// Single internal navigation handler. No inline-route interception and no duplicate listeners.
document.addEventListener('click',function(e){
  const el=e.target.closest('[data-route]');
  if(!el)return;
  e.preventDefault();
  go(el.dataset.route);
});
addEventListener('hashchange',render);render();
</script></body></html>
